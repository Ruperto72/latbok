name: Tester

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      # Fångar en sw.js vars CACHE_NAME inte matchar källfilerna — annars
      # fastnar mobiler i gammal cache.
      - run: npm run cache:check
